# Cloudflare Worker config for the Nellis Hunter Discord /hunt relay.
# Deploy:  cd bot && npx wrangler deploy
# Secrets: npx wrangler secret put DISCORD_PUBLIC_KEY
#          npx wrangler secret put GH_TOKEN
name = "nellis-hunter-bot"
main = "worker.js"
compatibility_date = "2024-09-23"

# Public, non-secret config. Point GH_REPO at your fork; GH_REF is the branch
# the on-demand workflow runs on.
[vars]
GH_REPO = "grontathan/nellis-hunter"
GH_REF = "main"

# Secrets (DISCORD_PUBLIC_KEY, GH_TOKEN) are NOT stored here — set them with
# `wrangler secret put`, which keeps them encrypted and out of source control.
